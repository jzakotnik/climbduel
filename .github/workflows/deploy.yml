name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy with rsync
        env:
          DEPLOY_USER: ${{ vars.DEPLOY_USER || 'jure' }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST || 'openlibry.de' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/html/derjure/cycleduel' }}
        run: |
          rsync -rltvz --delete \
            --exclude='.git/' --exclude='.github/' --exclude='.gitignore' \
            --exclude='README.md' --exclude='LICENSE' --exclude='set-domain.sh' \
            -e "ssh -i ~/.ssh/id_deploy" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
